  <!-- Language Toggle Added via Script -->
  <style>
    #lang-toggle {
      position: fixed; z-index: 999999; background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px); border: 1px solid rgba(212, 175, 55, 0.5);
      color: #d4af37; border-radius: 50px; cursor: pointer;
      transition: all 0.3s ease;
      top: 20px; right: 20px; padding: 8px 16px; font-family: 'Inter', sans-serif;
    }
    .lang-active { font-weight: bold; color: #fff; }
    #lang-toggle span { opacity: 0.7; }
    #lang-toggle span.lang-active { opacity: 1; }
  </style>
  
  <button id="lang-toggle"><span id="lang-en" class="lang-active">EN</span> | <span id="lang-te" style="font-family:'Noto Serif Telugu'">తెలుగు</span></button>
  
  <script>
    const langBtn = document.getElementById('lang-toggle');
    
    // Translation Map
    let currentLang = 'en';
    const translations = {
      "Keesaram Raveendra Babu": "కీసారం రవీంద్ర బాబు",
      "Murakambattu Aswini": "మురకంబట్టు అశ్విని",
      "KEESARAM RAVEENDRA BABU": "కీసారం రవీంద్ర బాబు",
      "MURAKAMBATTU ASWINI": "మురకంబట్టు అశ్విని",
      "weds": "మరియు",
      "Reception": "రిసెప్షన్",
      "Dinner": "విందు",
      "Auspicious Muhurtham": "శుభ ముహూర్తం",
      "Saturday, September 12, 2026": "12 సెప్టెంబర్ 2026, శనివారం",
      "7:00 PM onwards": "సాయంత్రం 7:00 గంటల నుండి",
      "Sunday, September 13, 2026": "13 సెప్టెంబర్ 2026, ఆదివారం",
      "Between 3:00 AM - 4:00 AM": "తెల్లవారుజామున 3:00 – 4:00 గంటల మధ్య",
      "Sri Subramanyaswamy Kalyana Mandapam": "శ్రీ సుబ్రహ్మణ్యస్వామి కళ్యాణ మండపం",
      "Utla Varipalli,": "ఉట్లవారిపల్లి,",
      "Pakala Mandal,": "పాకాల మండలం,",
      "Tirupati District.": "తిరుపతి జిల్లా.",
      "Sri K. Muneendra": "శ్రీ కె. మునీంద్ర",
      "Smt. K. Saraswathi": "శ్రీమతి కె. సరస్వతి",
      "Sri M. Sriramulu": "శ్రీ ఎం. శ్రీరాములు",
      "Smt. M. Ranemma": "శ్రీమతి ఎం. రణెమ్మ",
      "ProgVision": "ప్రోగ్‌విజన్"
    };
    
    let originalTexts = new Map();

    function walkDOMAndTranslate(node) {
      if (node.nodeType === 3) {
        let text = node.nodeValue;
        if (text && text.trim().length > 0) {
          if (currentLang === 'te') {
            if (!originalTexts.has(node)) originalTexts.set(node, text);
            let newText = originalTexts.get(node);
            for (const [en, te] of Object.entries(translations)) {
              newText = newText.replace(new RegExp(en, 'gi'), te);
            }
            if (newText !== text) node.nodeValue = newText;
          } else {
            if (originalTexts.has(node)) {
              node.nodeValue = originalTexts.get(node);
            }
          }
        }
      } else if (node.nodeType === 1 && node.nodeName !== "SCRIPT" && node.nodeName !== "STYLE" && node.id !== "lang-toggle") {
        for (let i = 0; i < node.childNodes.length; i++) {
          walkDOMAndTranslate(node.childNodes[i]);
        }
      }
    }

    langBtn.addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'te' : 'en';
      document.getElementById('lang-en').className = currentLang === 'en' ? 'lang-active' : '';
      document.getElementById('lang-te').className = currentLang === 'te' ? 'lang-active' : '';
      walkDOMAndTranslate(document.body);
    });

    setInterval(() => {
      if (currentLang === 'te') walkDOMAndTranslate(document.body);
    }, 1000);
  </script>
